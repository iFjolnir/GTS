<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guess the Song</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='12' width='56' height='40' rx='6' fill='%23C23A2B'/%3E%3Crect x='12' y='20' width='40' height='14' rx='3' fill='%23F8F2E4'/%3E%3Ccircle cx='22' cy='42' r='5' fill='%23F8F2E4'/%3E%3Ccircle cx='42' cy='42' r='5' fill='%23F8F2E4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800;900&family=IBM+Plex+Mono:wght@500;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --cherry:#C23A2B; --gold:#D99A2B;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
}
:root[data-theme="light"]{
  --bg:#EDE3CF; --card:#F8F2E4; --card2:#EFE5CE; --ink:#2A211A; --muted:#7A6A55;
  --line:#D9CCAF; --line2:#C4B694; --red:#C23A2B; --amber:#D99A2B;
  --btn-shadow:0 3px 0 rgba(42,33,26,.22);
}
:root[data-theme="dark"]{
  --bg:#12161F; --card:#1B2130; --card2:#242C3E; --ink:#EDEFF5; --muted:#94A0B8;
  --line:#333D54; --line2:#41507A; --red:#FF5A47; --amber:#F2B33D;
  --btn-shadow:0 3px 0 rgba(0,0,0,.55);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif; font-size:16px; line-height:1.45;
  min-height:100dvh;
}
#app{
  max-width:480px; margin:0 auto; min-height:100dvh;
  padding:14px 16px calc(28px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:14px;
}
button{font-family:inherit; color:inherit; cursor:pointer}
input,select{font-family:inherit; color:inherit; font-size:16px}

/* ---------- tape stripe (label motif) ---------- */
.stripes{height:10px; border-radius:99px; overflow:hidden; display:flex}
.stripes i{flex:1}
.stripes i:first-child{background:var(--red)}
.stripes i:last-child{background:var(--amber)}
.stripes.thin{height:6px}

/* ---------- typography ---------- */
.eyebrow{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:11px;
  letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
.brand{font-weight:900; font-size:30px; letter-spacing:-.5px; line-height:1.05; margin:2px 0 0}
h2.screen-title{font-weight:900; font-size:22px; letter-spacing:-.3px; margin:0}
.marker{font-family:'Permanent Marker','Marker Felt','Segoe Print','Comic Sans MS',cursive; font-weight:400}
.mono{font-family:'IBM Plex Mono',monospace}

/* ---------- header ---------- */
.top{display:flex; align-items:center; gap:10px}
.top .back{width:40px;height:40px;border-radius:10px;border:2px solid var(--line2);
  background:var(--card); font-size:19px; font-weight:800; box-shadow:var(--btn-shadow); flex:none}
.top .back:active{transform:translateY(2px); box-shadow:none}

/* ---------- cards ---------- */
.card{background:var(--card); border:2px solid var(--line2); border-radius:var(--r-lg);
  padding:16px; box-shadow:var(--btn-shadow)}
.card.flat{box-shadow:none}
.card2{background:var(--card2)}

/* ---------- buttons ---------- */
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  border:2px solid var(--line2); border-radius:var(--r-md); background:var(--card);
  font-weight:800; font-size:16px; padding:14px 16px; box-shadow:var(--btn-shadow);
  transition:transform .05s, box-shadow .05s}
.btn:active{transform:translateY(3px); box-shadow:none}
.btn.primary{background:var(--red); border-color:transparent; color:#FFF7EC}
.btn.big{font-size:19px; padding:18px}
.btn.quiet{box-shadow:none; border-style:dashed; font-weight:600; color:var(--muted); background:transparent}
.btn.danger{color:var(--red); border-color:var(--red)}
.btn-row{display:flex; gap:10px}
.btn-row .btn{flex:1}

/* ---------- head-to-head ---------- */
.h2h{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:6px; text-align:center}
.h2h .p .emb{width:52px;height:52px;margin:0 auto 6px; display:flex;align-items:center;justify-content:center;
  border-radius:50%; border:2px solid currentColor}
.h2h .p .emb svg{width:30px;height:30px}
.h2h .p .nm{font-weight:800; font-size:15px}
.h2h .score{font-weight:900; font-size:52px; letter-spacing:-2px; line-height:1; display:flex; align-items:baseline; gap:8px}
.h2h .score .colon{color:var(--muted); font-size:36px}
.h2h-sub{text-align:center; color:var(--muted); font-size:13px; margin-top:8px}

/* ---------- cassette ---------- */
.cassette{display:block; margin:0 auto}
.cassette .shell{fill:var(--card2); stroke:var(--line2); stroke-width:3}
.cassette .lbl{fill:var(--card); stroke:var(--line2); stroke-width:2}
.cassette .win{fill:var(--bg); stroke:var(--line2); stroke-width:2}
.cassette .reel{fill:none; stroke:currentColor; stroke-width:5}
.cassette .spokes{stroke:currentColor; stroke-width:5; stroke-linecap:round}
.cassette .screw{fill:var(--line2)}
.spin .reelgrp{animation:spin 2.6s linear infinite; transform-box:fill-box; transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- setup ---------- */
.field{display:flex; flex-direction:column; gap:8px}
.field > label{font-weight:800; font-size:14px}
.hint{font-size:12.5px; color:var(--muted)}
input.text{background:var(--card2); border:2px solid var(--line2); border-radius:var(--r-sm);
  padding:11px 12px; width:100%}
input.text:focus{outline:2px solid var(--red); outline-offset:1px}
input.marker-in{font-family:'Permanent Marker','Marker Felt','Segoe Print','Comic Sans MS',cursive; font-size:19px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{border:2px solid var(--line2); background:var(--card2); border-radius:99px;
  padding:6px 12px; font-size:13.5px; font-weight:600}
.chip.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.pchip{display:flex; align-items:center; gap:8px; border:2px solid var(--line2); background:var(--card2);
  border-radius:var(--r-md); padding:9px 13px; font-weight:800; font-size:15px}
.pchip svg{width:20px;height:20px}
.pchip.on{border-color:currentColor}
.rule{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 2px}
.rule + .rule{border-top:1.5px dashed var(--line)}
.rule .rl{font-weight:700; font-size:15px}
.rule .rs{font-size:12.5px; color:var(--muted); margin-top:1px}
.sub-rule{padding:2px 2px 12px 14px; border-left:3px solid var(--line)}
.toggle{position:relative; width:52px; height:30px; flex:none; border-radius:99px;
  border:2px solid var(--line2); background:var(--card2); transition:background .15s}
.toggle i{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%;
  background:var(--muted); transition:transform .15s, background .15s}
.toggle.on{background:var(--red); border-color:transparent}
.toggle.on i{transform:translateX(22px); background:#FFF7EC}
.seg{display:flex; border:2px solid var(--line2); border-radius:var(--r-sm); overflow:hidden}
.seg button{flex:1; border:0; background:var(--card2); padding:9px 6px; font-weight:700; font-size:13.5px}
.seg button.on{background:var(--ink); color:var(--bg)}
input.num{width:74px; text-align:center; background:var(--card2); border:2px solid var(--line2);
  border-radius:var(--r-sm); padding:9px 6px; font-weight:700}

/* ---------- game screen ---------- */
.turncard{border-radius:var(--r-lg); border:2.5px solid currentColor; padding:14px 16px 12px;
  background:var(--card); box-shadow:var(--btn-shadow); text-align:center}
.turncard .who{font-weight:900; font-size:32px; letter-spacing:-.5px; line-height:1.1; color:var(--ink);
  display:flex; align-items:center; justify-content:center; gap:10px}
.turncard .who svg{width:28px; height:28px}
.meta{display:flex; justify-content:space-between; align-items:center; padding:0 4px}
.meta .sc{font-weight:800; font-size:14.5px}
.meta .sc b{font-size:17px}
.guess-grid{display:grid; gap:10px}
.guess-grid.c2{grid-template-columns:1fr 1fr}
.guess-grid.c3{grid-template-columns:1fr 1fr 1fr}
.gbtn{border:2.5px solid var(--line2); border-radius:var(--r-lg); background:var(--card);
  padding:20px 6px 16px; display:flex; flex-direction:column; align-items:center; gap:6px;
  font-weight:900; font-size:17px; box-shadow:var(--btn-shadow); color:var(--ink);
  transition:transform .05s, box-shadow .05s}
.gbtn:active{transform:translateY(3px); box-shadow:none}
.gbtn .gicon{color:var(--ink); display:flex}
.gbtn .gicon svg{width:34px; height:34px}
.gbtn .mk{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line2);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:transparent}
.gbtn.on{border-color:currentColor}
.gbtn.on .mk{background:currentColor; border-color:currentColor}
.gbtn.on .mk span{color:#FFF7EC; display:block; transform:none}
.timer-card{display:flex; flex-direction:column; gap:10px}
.timer-top{display:flex; align-items:center; justify-content:space-between; gap:12px}
.timer-num{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:44px; line-height:1;
  letter-spacing:-1px; font-variant-numeric:tabular-nums}
.timer-btns{display:flex; gap:8px}
.tbtn{border:2px solid var(--line2); border-radius:10px; background:var(--card2);
  font-weight:800; font-size:14px; padding:10px 14px; box-shadow:var(--btn-shadow)}
.tbtn:active{transform:translateY(2px); box-shadow:none}
.timer-bar{height:8px; border-radius:99px; background:var(--card2); border:1.5px solid var(--line); overflow:hidden}
.timer-bar i{display:block; height:100%; background:var(--amber); transition:width .3s linear}
.timer-card.low .timer-bar i{background:var(--red)}
.timer-card.timeout{animation:flashout .5s steps(2,end) 4}
.timer-card.timeout .timer-num{color:var(--red)}
.timeout-lbl{font-family:'Permanent Marker','Marker Felt','Segoe Print','Comic Sans MS',cursive; font-size:19px; color:var(--red)}
@keyframes flashout{0%{background:var(--card)}50%{background:var(--red)}100%{background:var(--card)}}
.skip-zone{border:2px dashed var(--line2); border-radius:var(--r-md); background:transparent;
  width:100%; padding:12px; font-weight:700; font-size:15px; color:var(--muted)}
.skip-zone.armed{border-color:var(--red); color:var(--red); border-style:solid; background:var(--card)}
.hist{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none}
.hist::-webkit-scrollbar{display:none}
.hchip{flex:none; display:flex; align-items:center; gap:6px; border:2px solid var(--line2);
  border-radius:10px; background:var(--card); padding:7px 10px; font-size:12.5px; font-weight:700}
.hchip .dot{width:10px; height:10px; border-radius:50%; background:currentColor}
.hchip .got{font-family:'IBM Plex Mono',monospace; font-weight:700; color:var(--ink)}
.hchip .miss{color:var(--muted); font-weight:600}

/* ---------- finish ---------- */
.banner{text-align:center; padding:20px 16px}
.banner .wrap-lbl{font-family:'Permanent Marker','Marker Felt','Segoe Print','Comic Sans MS',cursive; font-size:20px; margin:4px 0 2px}
.banner .winner{font-weight:900; font-size:34px; letter-spacing:-.5px; line-height:1.1;
  display:flex; align-items:center; justify-content:center; gap:10px}
.banner .winner svg{width:30px; height:30px}
.banner .fscore{font-weight:900; font-size:26px; margin-top:8px}
.banner .winner.draw{font-size:25px}
.banner .funit{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; color:var(--muted); margin-top:3px}
.statcards{display:grid; grid-template-columns:1fr 1fr; gap:10px}
@media (max-width:360px){.statcards{grid-template-columns:1fr}}
.pcard{padding:13px}
.pcard .ph{display:flex; align-items:center; gap:8px; font-weight:800; font-size:15px;
  padding-bottom:8px; border-bottom:2px solid currentColor; margin-bottom:8px}
.pcard .ph svg{width:20px; height:20px}
.pcard .ph span{color:var(--ink)}
.srow{display:flex; justify-content:space-between; gap:8px; padding:5px 0; font-size:13px; color:var(--ink)}
.srow .k{color:var(--muted); font-weight:600}
.srow .v{font-weight:800; font-variant-numeric:tabular-nums; text-align:right}

/* ---------- stats & history ---------- */
.gitem{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:var(--card); border:2px solid var(--line2); border-radius:var(--r-md);
  padding:11px 13px; box-shadow:var(--btn-shadow)}
.gitem:active{transform:translateY(2px); box-shadow:none}
.gitem .gi-set{font-family:'Permanent Marker','Marker Felt','Segoe Print','Comic Sans MS',cursive; font-size:15px; line-height:1.2}
.gitem .gi-sub{font-size:12px; color:var(--muted); margin-top:1px}
.gitem .gi-score{margin-left:auto; font-weight:900; font-size:19px; white-space:nowrap}
.badge{font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; border:1.5px solid var(--line2); border-radius:6px; padding:2px 6px; color:var(--muted)}
.badge.live{color:var(--red); border-color:var(--red)}

/* ---------- settings ---------- */
.prow{display:flex; align-items:center; gap:10px; padding:10px 2px}
.prow + .prow{border-top:1.5px dashed var(--line)}
.prow .pemb{width:40px; height:40px; border-radius:50%; border:2px solid currentColor;
  display:flex; align-items:center; justify-content:center; flex:none}
.prow .pemb svg{width:22px; height:22px}
.prow .pname{font-weight:800; font-size:16px}
.prow .edit{margin-left:auto; border:2px solid var(--line2); background:var(--card2);
  border-radius:8px; font-weight:700; font-size:13px; padding:7px 12px}
.swatches{display:flex; flex-wrap:wrap; gap:10px}
.sw{width:38px; height:38px; border-radius:50%; border:3px solid transparent; padding:0; background:currentColor}
.sw.on{border-color:var(--ink); box-shadow:0 0 0 2px var(--bg) inset}
.icon-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:6px}
.ig{aspect-ratio:1; border:2px solid var(--line2); border-radius:10px; background:var(--card2);
  display:flex; align-items:center; justify-content:center; padding:0}
.ig svg{width:24px; height:24px}
.ig.on{border-color:currentColor; background:var(--card)}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(20,14,9,.55); display:flex;
  align-items:flex-end; justify-content:center; z-index:50; padding:0}
@media (min-width:480px){.overlay{align-items:center; padding:20px}}
.modal{background:var(--card); border:2px solid var(--line2); width:100%; max-width:440px;
  border-radius:20px 20px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:86dvh; overflow-y:auto; display:flex; flex-direction:column; gap:14px}
@media (min-width:480px){.modal{border-radius:20px}}
.modal h3{margin:0; font-weight:900; font-size:19px}
.modal .mtxt{font-size:14.5px; color:var(--muted); margin:0}

/* ---------- misc ---------- */
.empty{text-align:center; color:var(--muted); font-size:14px; padding:16px 8px}
.empty .marker{font-size:18px; color:var(--ink); display:block; margin-bottom:4px}
.spacer{flex:1}
.center{text-align:center}
a.link, button.link{background:none;border:none;padding:6px;font-size:14px;font-weight:700;
  color:var(--muted); text-decoration:underline; text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){
  .spin .reelgrp{animation:none}
  .timer-card.timeout{animation:none; outline:3px solid var(--red)}
}
:focus-visible{outline:2.5px solid var(--red); outline-offset:2px}
</style>
</head>

function el(tag, attrs, ...kids){
  const n=document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v=attrs[k];
    if(v==null) continue;
    if(k==='class') n.className=v;
    else if(k==='style') n.style.cssText=v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='html') n.innerHTML=v;
    else n.setAttribute(k, v);
  }
  for(const c of kids.flat(9)){
    if(c==null||c===false) continue;
    n.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(c):c);
  }
  return n;
}

var data=null;

const store={
  async load(){
    let fromWin=null;
    if(window.storage){
      try{ const r=await window.storage.get(KEY); if(r&&r.value!=null) fromWin=JSON.parse(r.value); }catch(e){}
    }
    if(fromWin) return fromWin;
    try{ const v=localStorage.getItem(KEY); if(v!=null) return JSON.parse(v); }catch(e){}
    return null;
  },
  saveSoon(){ clearTimeout(saveT); saveT=setTimeout(()=>store.saveNow(), 350); },
  async saveNow(){
    clearTimeout(saveT); saveT=null;
    const str=JSON.stringify(data);
    try{ localStorage.setItem(KEY, str); }catch(e){}

  }
};

/* ================= audio ================= */
let actx=null;
function sndOn(){ return data&&data.settings.sound; }
function ensureAudio(){
  if(!sndOn()) return null;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function tone(freq,dur,type,gain,when){
  const a=ensureAudio(); if(!a) return;
  const t0=a.currentTime+(when||0);
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(gain||0.06,t0+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0+dur+0.05);
}
function beepCount(n){ tone(n===1?940:700, 0.12, 'square', 0.07); }
function buzzTimeout(){ tone(196,0.42,'sawtooth',0.09); tone(147,0.5,'sawtooth',0.09,0.12); }

/* ================= timer (module scope: survives re-renders) ================= */
var timer={ total:0, secs:0, running:false, int:null, spentMs:0, lastTick:0, timedOut:false, everStarted:false };
function timerInit(total){
  timerStop();
  timer.total=total; timer.secs=total; timer.spentMs=0; timer.timedOut=false; timer.everStarted=false;
  timerPaint();
}
function timerToggle(){
  if(timer.running){ timerStop(); }
  else{
    if(timer.secs<=0) return;
    ensureAudio();
    timer.running=true; timer.everStarted=true; timer.lastTick=performance.now();
    timer.int=setInterval(timerTick,200);
  }
  timerPaint();
}
function timerStop(){
  timer.running=false;
  if(timer.int){ clearInterval(timer.int); timer.int=null; }
}
function timerReset(){ timerInit(timer.total); }
function timerTick(){
  const now=performance.now();
  timer.spentMs+=now-timer.lastTick; timer.lastTick=now;
  const newSecs=Math.max(0, timer.total-Math.floor(timer.spentMs/1000));
  if(newSecs!==timer.secs){
    timer.secs=newSecs;
    if(newSecs<=5&&newSecs>=1) beepCount(newSecs);
    if(newSecs===0){
      timerStop(); timer.timedOut=true; buzzTimeout();
      const card=$('#timer-card');
      if(card){ card.classList.remove('timeout'); void card.offsetWidth; card.classList.add('timeout'); }
    }
  }
  timerPaint();
}
function timerPaint(){
  const num=$('#timer-num'), bar=$('#timer-bar-i'), card=$('#timer-card'),
        btn=$('#timer-toggle'), lbl=$('#timeout-lbl');
  if(!num) return;
  const m=Math.floor(timer.secs/60), s=timer.secs%60;
  num.textContent=m+':'+String(s).padStart(2,'0');
  if(bar) bar.style.width=(timer.total?100*timer.secs/timer.total:0)+'%';
  if(card) card.classList.toggle('low', timer.secs<=10);
  if(btn) btn.textContent=timer.running?'Pause':(timer.spentMs>0&&!timer.timedOut?'Resume':'Start');
  if(lbl) lbl.style.display=timer.timedOut?'':'none';
}
function timerElapsedSecs(){ return timer.everStarted?Math.min(9999,Math.round(timer.spentMs/1000)):null; }

/* ================= lookups ================= */
function playerById(id){ return data.players.find(p=>p.id===id)||{id, name:'?', color:'cherry', icon:'mood'}; }
function gameById(id){ return data.games.find(g=>g.id===id); }

/* ================= game derivations ================= */
function nonSkipTurns(g){ return g.turns.filter(t=>!t.wasSkipped); }
function currentGuesserId(g){
  const n=nonSkipTurns(g).length;
  return g.players[n%g.players.length];
}
function currentRound(g){ return Math.floor(nonSkipTurns(g).length/g.players.length)+1; }
function roundsDone(g){ return Math.floor(nonSkipTurns(g).length/g.players.length); }
function isRoundLimited(g){ return g.rules.roundLimit!=='endless'; }
function turnPoints(t,rules){
  if(t.wasSkipped) return 0;
  return (t.songTitleCorrect?1:0)+(t.artistCorrect?1:0)+((rules.lyricsEnabled&&t.lyricsCorrect)?1:0);
}
function turnGuessedAny(t,rules){
  return !t.wasSkipped && (t.songTitleCorrect||t.artistCorrect||(rules.lyricsEnabled&&!!t.lyricsCorrect));
}
function turnGuessedForMode(t,rules){
  if(t.wasSkipped) return false;
  if(t.songTitleCorrect||t.artistCorrect) return true;
  return !!(rules.lyricsEnabled&&rules.lyricOnlyCountsAsGuessed&&t.lyricsCorrect);
}
function pointsFor(g,pid){
  return g.turns.filter(t=>t.guessingPlayerId===pid).reduce((a,t)=>a+turnPoints(t,g.rules),0);
}
function scoreFor(g,pid){
  const mine=g.turns.filter(t=>t.guessingPlayerId===pid);
  if(g.rules.scoringMode==='songs_guessed')
    return mine.reduce((a,t)=>a+(turnGuessedForMode(t,g.rules)?1:0),0);
  return mine.reduce((a,t)=>a+turnPoints(t,g.rules),0);
}
function scoreUnit(g,n){ return g.rules.scoringMode==='songs_guessed'?(n===1?'song':'songs'):(n===1?'pt':'pts'); }
function resultOf(g){
  if(g.players.length<2) return {winner:null, tiebreak:false, solo:true};
  const scores=g.players.map(p=>({p, s:scoreFor(g,p)}));
  const max=Math.max(...scores.map(x=>x.s));
  const leaders=scores.filter(x=>x.s===max).map(x=>x.p);
  if(leaders.length===1) return {winner:leaders[0], tiebreak:false, solo:false};
  if(g.rules.skipsEnabled){
    const left=leaders.map(p=>({p, l:skipsLeft(g,p)}));
    const mx=Math.max(...left.map(x=>x.l));
    const top=left.filter(x=>x.l===mx);
    if(top.length===1) return {winner:top[0].p, tiebreak:true, solo:false};
  }
  return {winner:null, tiebreak:false, solo:false};
}
function winnerOf(g){ return resultOf(g).winner; }
function skipsUsed(g,pid){ return g.turns.filter(t=>t.wasSkipped&&t.guessingPlayerId===pid).length; }
function skipsLeft(g,pid){ return Math.max(0,(g.rules.skipCount||0)-skipsUsed(g,pid)); }

function statsFor(g,pid){
  const rules=g.rules;
  const mine=g.turns.filter(t=>t.guessingPlayerId===pid);
  const ns=mine.filter(t=>!t.wasSkipped);
  const presented=ns.length;
  const guessed=ns.filter(t=>turnGuessedAny(t,rules)).length;
  const titles=ns.filter(t=>t.songTitleCorrect).length;
  const artists=ns.filter(t=>t.artistCorrect).length;
  const lyrics=rules.lyricsEnabled?ns.filter(t=>!!t.lyricsCorrect).length:null;
  const skips=mine.filter(t=>t.wasSkipped).length;
  // clutch: correct guesses in final round / with skips exhausted / under time pressure
  const clutchApplicable=!!(rules.skipsEnabled||rules.timerEnabled);
  let clutchN=0, skipsSoFar=0;
  for(const t of mine){
    if(t.wasSkipped){ skipsSoFar++; continue; }
    if(!turnGuessedAny(t,rules)) continue;
    const noSkips=rules.skipsEnabled&&skipsSoFar>=(rules.skipCount||0);
    const pressure=rules.timerEnabled&&t.timeTakenSeconds!=null&&t.timeTakenSeconds>=Math.max(1,rules.timerSeconds-10);
    if(noSkips||pressure) clutchN++;
  }
  const clutch=clutchApplicable?clutchN:null;
  let streak=0,best=0;
  for(const t of ns){ if(turnGuessedAny(t,rules)){streak++; best=Math.max(best,streak);} else streak=0; }
  return {presented,guessed,titles,artists,lyrics,skips,clutch,streak:best};
}

/* ================= lifetime derivations ================= */
function finishedGames(){ return data.games.filter(g=>g.status==='finished'); }
function headToHead(pa,pb){
  let wa=0,wb=0,d=0;
  for(const g of finishedGames()){
    if(g.players.length!==2||!(g.players.includes(pa.id)&&g.players.includes(pb.id))) continue;
    const w=winnerOf(g);
    if(w===pa.id) wa++; else if(w===pb.id) wb++; else d++;
  }
  return {wa,wb,d,total:wa+wb+d};
}
function lifetimeStats(pid){
  const gs=finishedGames().filter(g=>g.players.includes(pid));
  let presented=0,guessed=0,titles=0,artists=0,clutchN=0,anyClutch=false,best=0,wins=0;
  for(const g of gs){
    const s=statsFor(g,pid);
    presented+=s.presented; guessed+=s.guessed; titles+=s.titles; artists+=s.artists;
    if(s.clutch!=null){ anyClutch=true; clutchN+=s.clutch; }
    best=Math.max(best,s.streak);
    if(winnerOf(g)===pid) wins++;
  }
  return {games:gs.length,wins,presented,guessed,titles,artists,clutch:anyClutch?clutchN:null,best};
}

var ui={ screen:'home', gameId:null, marks:{title:false,artist:false,lyrics:false},
  skipArmed:false, skipArmT:null, modal:null, setupDraft:null, statsGameId:null };

function defaultRules(){
  return data.settings.lastRules?JSON.parse(JSON.stringify(data.settings.lastRules)):{
    lyricsEnabled:true, skipsEnabled:true, skipCount:3,
    scoringMode:'points', lyricOnlyCountsAsGuessed:false,
    timerEnabled:false, timerSeconds:60, roundLimit:10,
  };
}
function newSetupDraft(){
  const d=defaultRules();
  return { players:data.players.slice(0,2).map(p=>p.id),
           setLabel:'', rules:d, endless:d.roundLimit==='endless' };
}
function startGame(){
  const d=ui.setupDraft;
  const rules=JSON.parse(JSON.stringify(d.rules));
  rules.roundLimit = d.endless?'endless':Math.max(1,parseInt(d.rules.roundLimit)||10);
  rules.skipCount = rules.skipsEnabled?Math.max(1,parseInt(rules.skipCount)||3):0;
  rules.timerSeconds = rules.timerEnabled?Math.max(5,parseInt(rules.timerSeconds)||60):0;
  const label=(d.setLabel||'').trim()||'Untitled mix';
  let set=data.sets.find(s=>s.label.toLowerCase()===label.toLowerCase());
  if(set) set.lastUsed=Date.now();
  else data.sets.push({id:uid(), label, lastUsed:Date.now()});
  data.settings.lastRules=JSON.parse(JSON.stringify(rules));
  const g={ id:uid(), players:[...d.players], setLabel:label,
    status:'in_progress', rules, turns:[], createdAt:Date.now(), finishedAt:null };
  data.games.push(g);
  persist();
  openGame(g.id);
}
function openGame(id){
  const g=gameById(id);
  ui.gameId=id; ui.screen='game';
  ui.marks={title:false,artist:false,lyrics:false};
  disarmSkip();
  if(g.rules.timerEnabled) timerInit(g.rules.timerSeconds); else timerStop();
  render();
}
function completeTurn(){
  const g=gameById(ui.gameId); if(!g) return;
  const t={ id:uid(), gameId:g.id, roundNumber:currentRound(g),
    guessingPlayerId:currentGuesserId(g),
    songTitleCorrect:!!ui.marks.title, artistCorrect:!!ui.marks.artist,
    lyricsCorrect:g.rules.lyricsEnabled?!!ui.marks.lyrics:null,
    wasSkipped:false,
    timeTakenSeconds:g.rules.timerEnabled?timerElapsedSecs():null,
    timestamp:Date.now() };
  g.turns.push(t);
  ui.marks={title:false,artist:false,lyrics:false};
  disarmSkip();
  if(g.rules.timerEnabled) timerInit(g.rules.timerSeconds);
  persist();
  if(isRoundLimited(g)&&roundsDone(g)>=g.rules.roundLimit){ endOfSideModal(g); return; }
  render();
}
function endOfSideModal(g){
  const standings=g.players.map(id=>{const p=playerById(id);return p.name+' '+scoreFor(g,id);}).join(' \u00b7 ');
  const addRounds=n=>()=>{ g.rules.roundLimit=Number(g.rules.roundLimit)+n; persist(); closeModal(); };
  showModal({ locked:true,
    title:'End of the side',
    text:'Round '+g.rules.roundLimit+' is done \u2014 '+standings+'. Wrap it, or flip the tape and keep going?',
    actions:[
      {label:'Finish \u2014 that\u2019s a wrap', cls:'primary', fn:()=>{ closeModal(); finishGame(); }},
      {label:'+1 round', fn:addRounds(1)},
      {label:'+3 rounds', fn:addRounds(3)},
      {label:'Go endless', fn:()=>{ g.rules.roundLimit='endless'; persist(); closeModal(); }},
      {label:'Hold on \u2014 let me check something', cls:'quiet', fn:closeModal},
    ]});
}
function armSkip(){
  const g=gameById(ui.gameId); if(!g) return;
  if(skipsLeft(g,currentGuesserId(g))<=0) return;
  if(!ui.skipArmed){
    ui.skipArmed=true;
    clearTimeout(ui.skipArmT);
    ui.skipArmT=setTimeout(()=>{ui.skipArmed=false; render();},2600);
    render(); return;
  }
  doSkip();
}
function disarmSkip(){ ui.skipArmed=false; clearTimeout(ui.skipArmT); }
function doSkip(){
  const g=gameById(ui.gameId); if(!g) return;
  disarmSkip();
  g.turns.push({ id:uid(), gameId:g.id, roundNumber:currentRound(g),
    guessingPlayerId:currentGuesserId(g),
    songTitleCorrect:false, artistCorrect:false,
    lyricsCorrect:g.rules.lyricsEnabled?false:null,
    wasSkipped:true, timeTakenSeconds:null, timestamp:Date.now() });
  ui.marks={title:false,artist:false,lyrics:false};
  if(g.rules.timerEnabled) timerInit(g.rules.timerSeconds);
  persist(); render();
}
function finishGame(){
  const g=gameById(ui.gameId); if(!g) return;
  timerStop();
  g.status='finished'; g.finishedAt=Date.now();
  persist();
  ui.screen='finish'; render();
}
function archiveGame(g){ g.status='archived_incomplete'; g.finishedAt=Date.now(); persist(); }
function discardGame(g){ data.games=data.games.filter(x=>x.id!==g.id); persist(); }
function playAgain(){
  const old=gameById(ui.gameId); if(!old) return;
  const g={ id:uid(), players:[...old.players.slice(1), old.players[0]], setLabel:old.setLabel,
    status:'in_progress', rules:JSON.parse(JSON.stringify(old.rules)),
    turns:[], createdAt:Date.now(), finishedAt:null };
  const set=data.sets.find(s=>s.label.toLowerCase()===g.setLabel.toLowerCase());
  if(set) set.lastUsed=Date.now();
  data.games.push(g); persist();
  openGame(g.id);
}

function renderSetup(app){
  const d=ui.setupDraft||(ui.setupDraft=newSetupDraft());
  const r=d.rules;
  app.appendChild(screenHead('New game'));
  app.appendChild(stripes(true));

  // players
  const pf=el('div',{class:'card field'});
  pf.appendChild(el('label',null,'Players'));
  pf.appendChild(el('div',{class:'chips'}, data.players.map(p=>{
    const idx=d.players.indexOf(p.id), on=idx>=0;
    return el('button',{class:'pchip'+(on?' on':''), style:on?'color:'+pColor(p):'',
      'aria-pressed':String(on),
      onclick:()=>{ if(on) d.players=d.players.filter(x=>x!==p.id);
        else d.players.push(p.id); render(); }},
      on&&d.players.length>1?el('span',{class:'mono', style:'color:var(--muted);font-size:12px'},String(idx+1)):null,
      el('span',{style:'color:'+pColor(p),'aria-hidden':'true'},iconSvg(p.icon,20)),
      el('span',{style:'color:var(--ink)'},p.name));
  })));
  if(d.players.length===0){
    pf.appendChild(el('div',{class:'hint'},'Tap who\u2019s playing \u2014 one for a solo run, two for the classic, more for a party.'));
  } else if(d.players.length===1){
    pf.appendChild(el('div',{class:'hint'},'\u26a0 Solo run \u2014 saves to history, but not the lifetime head-to-head.'));
  } else if(d.players.length===2){
    const first=playerById(d.players[0]);
    pf.appendChild(el('div',{style:'display:flex;align-items:center;gap:10px'},
      el('span',{class:'hint'},'First to guess: ', el('b',null,first.name)),
      el('button',{class:'chip', onclick:()=>{ d.players.reverse(); render(); }},'\u21c4 swap')));
  } else {
    pf.appendChild(el('div',{class:'hint'},'Turn order: '+d.players.map(id=>playerById(id).name).join(' \u2192 ')));
  }
  app.appendChild(pf);

  // set label
  const sf=el('div',{class:'card field'});
  sf.appendChild(el('label',{for:'set-in'},'The song set'));
  sf.appendChild(el('input',{class:'text marker-in', id:'set-in', placeholder:'e.g. 2025 Wrapped', value:d.setLabel,
    oninput:(e)=>{ d.setLabel=e.target.value; }}));
  const recent=[...data.sets].sort((a,b)=>b.lastUsed-a.lastUsed).slice(0,6);
  if(recent.length) sf.appendChild(el('div',{class:'chips'}, recent.map(s=>
    el('button',{class:'chip'+(d.setLabel===s.label?' on':''), onclick:()=>{ d.setLabel=s.label; render(); }}, s.label))));
  sf.appendChild(el('div',{class:'hint'},'Whatever\u2019s playing on the other phone \u2014 a playlist, a Wrapped, chaos shuffle.'));
  app.appendChild(sf);

  // rules
  const rf=el('div',{class:'card'});
  rf.appendChild(el('div',{class:'eyebrow', style:'margin-bottom:4px'},'house rules'));
  rf.appendChild(toggleRow('Lyrics point','Sing a line, earn a point', r.lyricsEnabled, ()=>{ r.lyricsEnabled=!r.lyricsEnabled; render(); }));
  rf.appendChild(toggleRow('Skips','Free passes, no penalty', r.skipsEnabled, ()=>{ r.skipsEnabled=!r.skipsEnabled; render(); }));
  if(r.skipsEnabled) rf.appendChild(el('div',{class:'sub-rule rule'},
    el('div',{class:'rl'},'Skips per player'),
    el('input',{class:'num', type:'number', min:'1', max:'20', value:r.skipCount, inputmode:'numeric',
      oninput:(e)=>{ r.skipCount=e.target.value; }})));
  rf.appendChild(el('div',{class:'rule'},
    el('div',null, el('div',{class:'rl'},'Scoring'), el('div',{class:'rs'},'Count every point, or count songs cracked')),
    null));
  rf.appendChild(el('div',{class:'seg', style:'margin:2px 0 8px'},
    el('button',{class:r.scoringMode==='points'?'on':'', onclick:()=>{ r.scoringMode='points'; render(); }},'Points total'),
    el('button',{class:r.scoringMode==='songs_guessed'?'on':'', onclick:()=>{ r.scoringMode='songs_guessed'; render(); }},'Songs guessed')));
  if(r.scoringMode==='songs_guessed'&&r.lyricsEnabled)
    rf.appendChild(el('div',{class:'sub-rule'},
      toggleRow('Lyric-only counts as guessed','Nailed the lyric, blanked on the rest', r.lyricOnlyCountsAsGuessed,
        ()=>{ r.lyricOnlyCountsAsGuessed=!r.lyricOnlyCountsAsGuessed; render(); })));
  rf.appendChild(toggleRow('Timer','With a 5\u20264\u20263\u20262\u20261 for pressure', r.timerEnabled, ()=>{ r.timerEnabled=!r.timerEnabled; render(); }));
  if(r.timerEnabled){
    const sec=parseInt(r.timerSeconds)||60;
    rf.appendChild(el('div',{class:'sub-rule field'},
      el('div',{class:'seg'},
        TIMER_PRESETS.map(p=>el('button',{class:sec===p&&!r.customTimer?'on':'', onclick:()=>{ r.timerSeconds=p; r.customTimer=false; render(); }}, p+'s')),
        el('button',{class:r.customTimer?'on':'', onclick:()=>{ r.customTimer=true; render(); }},'Custom')),
      r.customTimer?el('input',{class:'num', type:'number', min:'5', max:'600', value:r.timerSeconds, inputmode:'numeric',
        oninput:(e)=>{ r.timerSeconds=e.target.value; }}):null));
  }
  rf.appendChild(el('div',{class:'rule'},
    el('div',null, el('div',{class:'rl'},'Rounds'), el('div',{class:'rs'},'A round = one song each')),
    el('div',{style:'display:flex;align-items:center;gap:8px'},
      d.endless?null:el('input',{class:'num', type:'number', min:'1', max:'99', value:r.roundLimit==='endless'?10:r.roundLimit, inputmode:'numeric',
        oninput:(e)=>{ r.roundLimit=e.target.value; }}),
      el('button',{class:'chip'+(d.endless?' on':''), onclick:()=>{ d.endless=!d.endless; render(); }},'Endless'))));
  app.appendChild(rf);

  app.appendChild(el('button',{class:'btn primary big', disabled:d.players.length<1?'':null,
    style:d.players.length<1?'opacity:.5':'', onclick:()=>{ if(d.players.length>=1) startGame(); }},'Press record \u25cf'));
}

/* ================= GAME ================= */
function renderGame(app){
  const g=gameById(ui.gameId);
  if(!g||g.status!=='in_progress'){ ui.screen='home'; renderHome(app); return; }
  const gid=currentGuesserId(g), guesser=playerById(gid);
  const plist=g.players.map(playerById);
  const col=pColor(guesser);

  app.appendChild(el('div',{class:'top'},
    el('button',{class:'back','aria-label':'Back to home', onclick:()=>{ timerStop(); disarmSkip(); persist(); ui.screen='home'; render(); }},'\u2190'),
    el('div',{class:'eyebrow'},g.setLabel),
    el('div',{class:'spacer'}),
    el('button',{class:'link', onclick:()=>{
      showModal({title:'Finish this game?',
        text:'Current score: '+plist.map(p=>p.name+' '+scoreFor(g,p.id)).join(' \u00b7 ')+'.',
        actions:[
          {label:'Finish \u2014 that\u2019s a wrap', cls:'primary', fn:()=>{ closeModal(); finishGame(); }},
          {label:'Keep playing', cls:'quiet', fn:closeModal}]});
    }},'Finish')));

  const tc=el('div',{class:'turncard', style:'color:'+col});
  tc.appendChild(cassetteSvg(96,true));
  tc.appendChild(el('div',{class:'eyebrow', style:'margin-top:6px'},'now guessing'));
  tc.appendChild(el('div',{class:'who'},
    el('span',{style:'color:'+col+';display:inline-flex'}, iconSvg(guesser.icon)), guesser.name));
  app.appendChild(tc);

  app.appendChild(el('div',{class:'meta'},
    el('div',{class:'eyebrow'},'round '+currentRound(g)+(isRoundLimited(g)?' / '+g.rules.roundLimit:' \u00b7 endless')),
    el('div',{class:'sc'},
      plist.flatMap((p,i)=>[
        i>0?'\u2002\u00b7\u2002':null,
        el('span',{style:'color:'+pColor(p)},'\u25cf '), p.name+' ', el('b',null,String(scoreFor(g,p.id)))]),
      ' '+scoreUnit(g,2))));

  const cols=g.rules.lyricsEnabled?'c3':'c2';
  const gg=el('div',{class:'guess-grid '+cols});
  const mkBtn=(key,label,icon)=>{
    const on=ui.marks[key];
    return el('button',{class:'gbtn'+(on?' on':''), style:'color:'+col, 'aria-pressed':String(!!on),
      'aria-label':label, title:label,
      onclick:()=>{ ui.marks[key]=!ui.marks[key]; disarmSkip(); render(); }},
      el('span',{class:'mk'}, el('span',null,'\u2713')),
      el('span',{class:'gicon'}, iconSvg(icon)));
  };
  gg.appendChild(mkBtn('title','Title','text_fields_alt'));
  gg.appendChild(mkBtn('artist','Artist','person'));
  if(g.rules.lyricsEnabled) gg.appendChild(mkBtn('lyrics','Lyrics','text_ad'));
  app.appendChild(gg);

  if(g.rules.timerEnabled){
    app.appendChild(el('div',{class:'card timer-card', id:'timer-card'},
      el('div',{class:'timer-top'},
        el('div',null,
          el('div',{class:'eyebrow'},'timer ', el('span',{class:'timeout-lbl', id:'timeout-lbl', style:'display:none'},'time out!')),
          el('div',{class:'timer-num', id:'timer-num'},'0:00')),
        el('div',{class:'timer-btns'},
          el('button',{class:'tbtn', id:'timer-toggle', onclick:timerToggle},'Start'),
          el('button',{class:'tbtn', onclick:()=>{ timerReset(); }},'Reset'))),
      el('div',{class:'timer-bar'}, el('i',{id:'timer-bar-i'}))));
  }

  if(g.rules.skipsEnabled){
    const left=skipsLeft(g,gid);
    app.appendChild(el('button',{class:'skip-zone'+(ui.skipArmed?' armed':''),
      disabled:left<=0?'':null, style:left<=0?'opacity:.5':'',
      onclick:armSkip},
      left<=0?'No skips left \u2014 face the music':
      ui.skipArmed?'Tap again to skip \u2192':'Skip this song \u00b7 '+left+' left'));
  }

  app.appendChild(el('button',{class:'btn primary big', onclick:completeTurn},'Complete turn \u2192'));

  if(g.turns.length){
    const strip=el('div',{class:'hist'});
    const recent=g.turns.slice(-14);
    for(let i=recent.length-1;i>=0;i--){
      const t=recent[i], p=playerById(t.guessingPlayerId);
      let got;
      if(t.wasSkipped) got=el('span',{class:'miss'},'skip');
      else{
        const parts=[];
        parts.push(el('span',{class:t.songTitleCorrect?'got':'miss'},'T'));
        parts.push(el('span',{class:t.artistCorrect?'got':'miss'},'A'));
        if(g.rules.lyricsEnabled) parts.push(el('span',{class:t.lyricsCorrect?'got':'miss'},'L'));
        got=el('span',{style:'display:flex;gap:4px'},parts);
      }
      strip.appendChild(el('button',{class:'hchip', style:'color:'+pColor(p),
        onclick:()=>editTurnModal(g,t)},
        el('span',{class:'mono', style:'color:var(--muted)'},'R'+t.roundNumber),
        el('span',{class:'dot'}), got));
    }
    app.appendChild(el('div',null, el('div',{class:'eyebrow', style:'margin-bottom:5px'},'this game \u00b7 tap a turn to fix it'), strip));
  }
}
function editTurnModal(g,t){
  const isLast=g.turns[g.turns.length-1]&&g.turns[g.turns.length-1].id===t.id;
  const p=playerById(t.guessingPlayerId);
  const tmp={title:!!t.songTitleCorrect, artist:!!t.artistCorrect, lyrics:!!t.lyricsCorrect};
  const body=[];
  if(t.wasSkipped){
    body.push(el('p',{class:'mtxt'},p.name+' skipped this one in round '+t.roundNumber+'. Nothing to edit \u2014 a skip is a skip.'));
  } else {
    const wrap=el('div',{class:'card flat card2', style:'padding:4px 12px'});
    const row=(label,key)=>toggleRow(label,null,tmp[key],()=>{ tmp[key]=!tmp[key];
      const tg=wrap.querySelectorAll('.toggle')[({title:0,artist:1,lyrics:2})[key]];
      tg.classList.toggle('on'); tg.setAttribute('aria-checked',tg.classList.contains('on')); });
    wrap.appendChild(row('Title','title'));
    wrap.appendChild(row('Artist','artist'));
    if(g.rules.lyricsEnabled) wrap.appendChild(row('Lyrics','lyrics'));
    body.push(wrap);
  }
  const actions=[];
  if(!t.wasSkipped) actions.push({label:'Save fix', cls:'primary', fn:()=>{
    t.songTitleCorrect=tmp.title; t.artistCorrect=tmp.artist;
    t.lyricsCorrect=g.rules.lyricsEnabled?tmp.lyrics:null;
    persist(); closeModal();
  }});
  if(isLast) actions.push({label:'Delete this turn', cls:'danger', fn:()=>{
    g.turns.pop(); persist(); closeModal();
  }});
  actions.push({label:'Cancel', cls:'quiet', fn:closeModal});
  showModal({title:p.name+' \u00b7 round '+t.roundNumber, body, actions});
}

/* ================= FINISH ================= */
function resultBanner(g){
  const plist=g.players.map(playerById);
  const res=resultOf(g);
  const b=el('div',{class:'card banner'});
  b.appendChild(el('div',{class:'eyebrow'},g.setLabel+' \u00b7 '+fmtDate(g.finishedAt||g.createdAt)));
  b.appendChild(el('div',{class:'wrap-lbl'},res.solo?'Solo run \u2014 in the books.':'That\u2019s a wrap!'));
  if(res.winner){
    const wp=playerById(res.winner);
    b.appendChild(el('div',{class:'winner', style:'color:'+pColor(wp)}, iconSvg(wp.icon),
      el('span',{style:'color:var(--ink)'},wp.name+' takes it'+(res.tiebreak?'*':''))));
  } else if(!res.solo){
    b.appendChild(el('div',{class:'winner draw'},'Dead heat \u2014 a draw'));
  }
  const parts=plist.map(p=>{
    const star=res.tiebreak&&res.winner===p.id?'*':'';
    return plist.length===1?String(scoreFor(g,p.id)):p.name+' '+scoreFor(g,p.id)+star;
  });
  const total=plist.reduce((a,p)=>a+scoreFor(g,p.id),0);
  b.appendChild(el('div',{class:'fscore'}, parts.join(plist.length===2?' : ':' \u00b7 ')));
  b.appendChild(el('div',{class:'funit'}, scoreUnit(g,total)));
  if(res.tiebreak) b.appendChild(el('div',{class:'funit'},'* took the tie on skips left'));
  return b;
}
function statCards(g){
  const wrap=el('div',{class:'statcards', style:g.players.length===1?'grid-template-columns:1fr':''});
  for(const pid of g.players){
    const p=playerById(pid), s=statsFor(g,pid), r=g.rules;
    const c=el('div',{class:'card pcard', style:'color:'+pColor(p)});
    c.appendChild(el('div',{class:'ph'}, iconSvg(p.icon), el('span',null,p.name)));
    const row=(k,v)=>c.appendChild(el('div',{class:'srow'}, el('span',{class:'k'},k), el('span',{class:'v'},v)));
    row('Points', pointsFor(g,pid)+' pts');
    row('Songs guessed', s.guessed+' / '+s.presented+' ('+pct(s.guessed,s.presented)+')');
    row('Title hits', s.titles+' ('+pct(s.titles,s.presented)+')');
    row('Artist hits', s.artists+' ('+pct(s.artists,s.presented)+')');
    if(r.lyricsEnabled) row('Lyrics landed', s.lyrics+' / '+s.presented);
    if(r.skipsEnabled) row('Skips used', s.skips+' / '+r.skipCount);
    row('Clutch \u26a1', s.clutch==null?'\u2014':String(s.clutch));
    row('Best streak', String(s.streak));
    wrap.appendChild(c);
  }
  return wrap;
}
function renderFinish(app){
  const g=gameById(ui.gameId);
  if(!g){ ui.screen='home'; renderHome(app); return; }
  app.appendChild(stripes());
  app.appendChild(resultBanner(g));
  app.appendChild(statCards(g));
  const nextFirst=playerById(g.players[1]||g.players[0]);
  app.appendChild(el('button',{class:'btn primary big', onclick:playAgain},
    g.players.length>1?'Run it back \u00b7 '+nextFirst.name+' starts':'Run it back'));
  app.appendChild(el('button',{class:'btn', onclick:()=>{ ui.screen='home'; render(); }},'Home'));
}

/* ================= STATS ================= */
function renderStats(app){
  app.appendChild(screenHead('Stats & history'));
  app.appendChild(stripes(true));
  app.appendChild(h2hCard());
  const [pa,pb]=data.players;
  if(pa&&pb){
    const lw=el('div',{class:'statcards'});
    for(const p of [pa,pb]){
      const s=lifetimeStats(p.id);
      const c=el('div',{class:'card pcard', style:'color:'+pColor(p)});
      c.appendChild(el('div',{class:'ph'}, iconSvg(p.icon), el('span',null,p.name)));
      const row=(k,v)=>c.appendChild(el('div',{class:'srow'}, el('span',{class:'k'},k), el('span',{class:'v'},v)));
      row('Games won', String(s.wins)+' / '+s.games);
      row('Guess rate', pct(s.guessed,s.presented));
      row('Title rate', pct(s.titles,s.presented));
      row('Artist rate', pct(s.artists,s.presented));
      row('Clutch \u26a1', s.clutch==null?'\u2014':String(s.clutch));
      row('Best streak', String(s.best));
      lw.appendChild(c);
    }
    app.appendChild(lw);
  }
  const games=[...data.games].sort((a,b)=>b.createdAt-a.createdAt);
  app.appendChild(el('div',{class:'eyebrow', style:'margin-top:4px'},'game history'));
  if(!games.length) app.appendChild(el('div',{class:'empty'}, el('span',{class:'marker'},'Blank tape.'),'Every game you finish lands here.'));
  for(const g of games){
    const plist=g.players.map(playerById);
    const who=plist.length===1?plist[0].name+' \u00b7 solo':plist.map(p=>p.name).join(' vs ');
    const badge=g.status==='in_progress'?el('span',{class:'badge live'},'live')
      :g.status==='archived_incomplete'?el('span',{class:'badge'},'didn\u2019t count'):null;
    app.appendChild(el('button',{class:'gitem', onclick:()=>{
      if(g.status==='in_progress'){ openGame(g.id); }
      else{ ui.statsGameId=g.id; ui.screen='gamedetail'; render(); }
    }},
      el('div',null,
        el('div',{class:'gi-set'},g.setLabel),
        el('div',{class:'gi-sub'},fmtDate(g.createdAt)+' \u00b7 '+who,' ',badge)),
      el('div',{class:'gi-score'}, plist.map(p=>pointsFor(g,p.id)).join(' : '))));
  }
}
function renderGameDetail(app){
  const g=gameById(ui.statsGameId);
  if(!g){ ui.screen='stats'; renderStats(app); return; }
  app.appendChild(screenHead('Game recap','stats'));
  if(g.status==='archived_incomplete') app.appendChild(el('div',{class:'hint center'},'Archived unfinished \u2014 not counted in the lifetime score.'));
  app.appendChild(resultBanner(g));
  app.appendChild(statCards(g));
}

/* ================= SETTINGS ================= */
function renderSettings(app){
  app.appendChild(screenHead('Settings'));
  app.appendChild(stripes(true));

  const pc=el('div',{class:'card'});
  pc.appendChild(el('div',{class:'eyebrow', style:'margin-bottom:4px'},'players'));
  for(const p of data.players){
    pc.appendChild(el('div',{class:'prow', style:'color:'+pColor(p)},
      el('span',{class:'pemb'}, iconSvg(p.icon)),
      el('span',{class:'pname', style:'color:var(--ink)'},p.name),
      el('button',{class:'edit', onclick:()=>playerModal(p)},'Edit')));
  }
  if(data.players.length<6)
    pc.appendChild(el('button',{class:'btn quiet', style:'margin-top:8px', onclick:()=>playerModal(null)},'+ Add a player'));
  app.appendChild(pc);

  const ac=el('div',{class:'card'});
  ac.appendChild(el('div',{class:'eyebrow', style:'margin-bottom:8px'},'appearance'));
  ac.appendChild(el('div',{class:'seg'},
    [['system','System'],['light','Light'],['dark','Dark']].map(([v,l])=>
      el('button',{class:data.settings.theme===v?'on':'', onclick:()=>{ data.settings.theme=v; persist(); applyTheme(); render(); }},l))));
  ac.appendChild(toggleRow('Countdown sounds','Beeps at 5\u20264\u20263\u20262\u20261, buzz at zero', data.settings.sound,
    ()=>{ data.settings.sound=!data.settings.sound; persist(); render(); }));
  app.appendChild(ac);

  const dc=el('div',{class:'card field'});
  dc.appendChild(el('div',{class:'eyebrow'},'your data'));
  dc.appendChild(el('button',{class:'btn', onclick:exportData},'Export backup (JSON)'));
  dc.appendChild(el('button',{class:'link', style:'align-self:center', onclick:()=>{
    const ta=el('textarea',{class:'text', style:'height:200px;font-size:11.5px', readonly:''});
    ta.value=JSON.stringify(data);
    showModal({title:'Backup as text', text:'Select all, copy, stash it somewhere safe.',
      body:[ta], actions:[{label:'Done', cls:'primary', fn:closeModal}]});
  }},'Show backup as text instead'));
  const fileIn=el('input',{type:'file', accept:'.json,application/json', style:'display:none',
    onchange:(e)=>{ const f=e.target.files[0]; if(!f) return;
      const rd=new FileReader();
      rd.onload=()=>importData(String(rd.result));
      rd.readAsText(f); e.target.value=''; }});
  dc.appendChild(fileIn);
  dc.appendChild(el('button',{class:'btn', onclick:()=>fileIn.click()},'Import backup'));
  dc.appendChild(el('button',{class:'btn danger', onclick:()=>showModal({
    title:'Reset stats only?', text:'Wipes every game and set label. Players and settings stay.',
    actions:[{label:'Yes, wipe the games', cls:'danger', fn:()=>{ data.games=[]; data.sets=[]; persist(); closeModal(); }},
             {label:'Cancel', cls:'quiet', fn:closeModal}]})},'Reset stats only'));
  dc.appendChild(el('button',{class:'btn danger', onclick:()=>showModal({
    title:'Reset everything?', text:'This wipes the whole tape \u2014 players, games, history, all of it. Export a backup first if in doubt.',
    actions:[{label:'Burn it all down', cls:'danger', fn:()=>{ data=seedData(); persist(); applyTheme(); closeModal(); }},
             {label:'Cancel', cls:'quiet', fn:closeModal}]})},'Reset all data'));
  app.appendChild(dc);
}
function playerModal(p){
  const isNew=!p;
  const tmp={ name:p?p.name:'', color:p?p.color:SWATCHES[(data.players.length)%SWATCHES.length].id, icon:p?p.icon:'star_shine' };
  const nameIn=el('input',{class:'text', placeholder:'Name', value:tmp.name, maxlength:'18',
    oninput:(e)=>{ tmp.name=e.target.value; }});
  const swWrap=el('div',{class:'swatches'});
  const igWrap=el('div',{class:'icon-grid'});
  function paint(){
    swWrap.innerHTML='';
    for(const s of SWATCHES){
      swWrap.appendChild(el('button',{class:'sw'+(tmp.color===s.id?' on':''),
        style:'color:'+(document.documentElement.dataset.theme==='dark'?s.dark:s.light),
        'aria-label':s.id, onclick:()=>{ tmp.color=s.id; paint(); }}));
    }
    igWrap.innerHTML='';
    for(const name of EMBLEMS){
      igWrap.appendChild(el('button',{class:'ig'+(tmp.icon===name?' on':''),
        style:'color:'+swColor(tmp.color), 'aria-label':name,
        onclick:()=>{ tmp.icon=name; paint(); }}, iconSvg(name)));
    }
  }
  paint();
  const referenced=p?data.games.some(g=>g.players.includes(p.id)):false;
  const actions=[
    {label:isNew?'Add player':'Save', cls:'primary', fn:()=>{
      const nm=(tmp.name||'').trim(); if(!nm) return;
      if(isNew) data.players.push({id:uid(), name:nm, color:tmp.color, icon:tmp.icon});
      else { p.name=nm; p.color=tmp.color; p.icon=tmp.icon; }
      persist(); closeModal();
    }}];
  if(p&&!referenced&&data.players.length>2)
    actions.push({label:'Remove player', cls:'danger', fn:()=>{ data.players=data.players.filter(x=>x.id!==p.id); persist(); closeModal(); }});
  actions.push({label:'Cancel', cls:'quiet', fn:closeModal});
  showModal({title:isNew?'New player':'Edit '+p.name, body:[nameIn, swWrap, igWrap], actions});
}

/* ================= export / import ================= */
function exportData(){
  const str=JSON.stringify(data,null,2);
  const stamp=new Date().toISOString().slice(0,10);
  try{
    const blob=new Blob([str],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='guess-the-song-backup-'+stamp+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },400);
  }catch(e){
    const ta=el('textarea',{class:'text', style:'height:180px;font-size:12px'},str);
    showModal({title:'Copy your backup', body:[ta], actions:[{label:'Done', cls:'primary', fn:closeModal}]});
  }
}
function importData(str){
  let parsed=null;
  try{ parsed=JSON.parse(str); }catch(e){}
  if(!parsed||!Array.isArray(parsed.players)||!Array.isArray(parsed.games)){
    showModal({title:'That tape won\u2019t play', text:'This file doesn\u2019t look like a Guess the Song backup. Nothing was changed.',
      actions:[{label:'OK', cls:'primary', fn:closeModal}]});
    return;
  }
  showModal({title:'Replace everything?',
    text:'Importing overwrites the current players, games, and history with the backup ('+parsed.games.length+' games, '+parsed.players.length+' players).',
    actions:[
      {label:'Import & replace', cls:'primary', fn:()=>{
        data=parsed;
        data.settings=Object.assign({theme:'system',sound:true,lastRules:null}, data.settings||{});
        data.sets=data.sets||[];
        persist(); applyTheme(); closeModal();
      }},
      {label:'Cancel', cls:'quiet', fn:closeModal}]});
}

/* ================= boot ================= */
(async function init(){
  let loaded=await store.load();
  if(!loaded){ data=seedData(); store.saveNow(); }
  else{
    data=loaded;
    data.settings=Object.assign({theme:'system',sound:true,lastRules:null}, data.settings||{});
    data.sets=data.sets||[]; data.games=data.games||[]; data.players=data.players||[];
  }
  applyTheme();
  render();
})();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&data) store.saveNow(); });
</script>
</body>
